# Two members (#225 Step 1b, docs/plan/harness-npm-lib.md §2.1): the library
# moved to packages/ in Step 1a and is now a workspace member, so
# `@hames-ai/harness-patterns` resolves via workspace:* to live source.
packages:
  - app
  - packages/*

# Moved from app/package.json `pnpm.onlyBuiltDependencies`: pnpm 10 reads the
# dependency build-script allowlist from the workspace manifest, not from a
# member's package.json. Without it node-pty compiles nothing and every pty
# path dies.
onlyBuiltDependencies:
  - node-pty

# Release-age cooldown (#480 a): a freshly published version must be at
# least this many minutes old before an install can RESOLVE it — 4320 = 3
# days. This is the general policy #478's review offered as the alternative
# to hand-tightening the rollup range below (O1,
# https://github.com/mknw/hames-playground/pull/478#issuecomment-5996584721);
# the owner took both: the cooldown guards every dependency now, and rollup
# goes back to a normal `^` range below because the cooldown, not a `~`,
# is what keeps a same-day release out.
#
# It guards a NEW resolution — `pnpm add`, `pnpm update`, or a manifest range
# change that forces one — and does NOT re-validate what a
# `--frozen-lockfile` install (CI, `app/Dockerfile`) already finds pinned in
# the committed lockfile: on pnpm 10.28.1 the check runs during resolution
# only, confirmed against github.com/pnpm/pnpm/issues/10438 (filed on
# 10.27.0 — a version already present in the lockfile installs regardless of
# its age). pnpm 11.1.3 added a verification pass that re-applies
# `minimumReleaseAge` to every lockfile entry on install; `trustLockfile`
# (11.3.0) is its opt-out, not the check. While this repo pins 10.28.1,
# frozen installs are unaffected — on pnpm >= 11.1.3 they would fail on any
# lockfile entry younger than the cooldown.
#
# `minimumReleaseAgeExclude` takes package names, scope globs or an exact
# `name@version`; our own packages are not on a registry today, but excluding
# the scope now means a future `@hames-ai/*` publish never waits on its own
# release.
#
# To take an urgent security fix published inside the 3-day window: add the
# package (or `name@version`) to the list below, then run `pnpm update <pkg>`;
# or run `pnpm update <pkg> --config.minimum-release-age=0` once and commit
# the result — a plain `pnpm install` does not re-resolve a lockfile that
# already satisfies the manifest, and the flag is a one-shot override, never a
# standing change here.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@hames-ai/*"

# A normal ^-range: the cooldown above is what now guards a freshly published
# version, so this no longer needs the hand-tightened `~4.63.6` O1 settled on
# before that policy existed (same review as above). rollup 4.63.6 is the
# first release that imports an external's re-exported bindings when a
# dynamically imported module's namespace is built as an object in a shared
# chunk (rollup#6540). The server bundle needs that since #469 made
# @boundaryml/baml a rollup external (app/app.config.ts): baml_client/index.ts
# re-exports three of baml's error classes and is loaded by `await import()`.
# On 4.60.2 its namespace object named those classes without importing them,
# so every route that loads BAML threw `ReferenceError:
# BamlClientFinishReasonError is not defined`.
overrides:
  rollup: ^4.63.6
