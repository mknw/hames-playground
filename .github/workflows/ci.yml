name: CI

# Gates merges into main. Deployment is deliberately NOT here: a gate answers
# "is this head SHA sound", a deploy acts on a merge commit. Fusing them makes
# both slower and the gate less trustworthy.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the PR base for the formatting check.
          fetch-depth: 0

      # No `version:` input on purpose: the root package.json's packageManager
      # field (pnpm@10.28.1, matching the Dockerfile's PNPM_VERSION) is the
      # single pin, and action-setup reads it from the checkout above. Passing
      # both makes action-setup@v4 fail with "multiple versions specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The lockfile is the workspace root's (#225 Step 0), so the install runs
      # from the repo root, not from the `app` default below.
      #
      # There is no generate step any more: the ONE BAML corpus lives in
      # `packages/harness-baml/baml_src` and its `baml_client/` is COMMITTED
      # beside it, so a checkout already has the generated client. A client
      # that drifts from that corpus is caught by `baml-version-check.test.ts`
      # in the Test step below — which is IN this gate — rather than papered
      # over by regenerating on the way in. (The app-path e2e layer has its own
      # client-vs-sources pin, but this workflow never invokes that layer, so it
      # is not what makes drift a CI failure.)
      - run: pnpm install --frozen-lockfile
        working-directory: .

      # configs/mcp-config.yaml is COMMITTED with the compose-default
      # credentials (same laptop-only defaults docker-compose.yaml ships). The
      # committed copy is enough for the server-catalog tests that read it.
      - name: Seed local-only config
        working-directory: .
        run: cp -n configs/template.mcp-config.yaml configs/mcp-config.yaml || true

      # Pins the destructive-import guard in scripts/import-neo4j.sh (PR #318
      # review round): refuse-on-populated, --wipe-proceeds, fail-closed on an
      # unreadable node count, and a failed DETACH DELETE failing the script —
      # all via a `docker` shim, no daemon needed.
      - name: Shell tests (import guard)
        working-directory: .
        run: scripts/import-neo4j.test.sh

      - run: pnpm typecheck

      - run: pnpm lint

      # Formatting is enforced on CHANGED files only. The repo predates Prettier,
      # so a global --check would fail on ~320 untouched files; the codebase
      # converges as files are edited (see the pre-commit hook). New and edited
      # code still has to be formatted.
      #
      # Renames (R) are included: a git mv + edit in the same PR must not
      # bypass prettier as standing policy. The paths are filtered with grep
      # rather than a pathspec: a pathspec hides the deleted side of a rename,
      # so git scores every moved file as an Add and a directory move (#192,
      # ui/ → app/) would drag the whole legacy tree into the check. Guard
      # bulk moves by count, not by dropping the rename class outright: past
      # BULK_MOVE_LIMIT changed files the PR is a directory move, the list is
      # dominated by untouched legacy code, and the check is skipped with a
      # loud ::warning:: rather than failing on files nobody wrote.
      - name: Format check (changed files)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BULK_MOVE_LIMIT: 100
        run: |
          files=$(git diff --name-only --diff-filter=ACMR \
                    "${{ github.event.pull_request.base.sha }}" HEAD \
                    | grep -E '^app/.*\.(ts|tsx|js|jsx|json|css|md)$' || true)
          if [ -z "$files" ]; then
            echo "No formattable files changed."
            exit 0
          fi
          count=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
          if [ "$count" -gt "$BULK_MOVE_LIMIT" ]; then
            echo "::warning title=Prettier check skipped::$count formattable files changed (> $BULK_MOVE_LIMIT) — this looks like a bulk move/rename, so the changed-file format check was SKIPPED. Format any hand-edited files locally (pnpm exec prettier --write <paths>)."
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086
          ./app/node_modules/.bin/prettier --check $files

      # Coverage is measured on the same vitest invocation (v8 instrumentation
      # is near-free here — under a second of extra wall clock locally). The
      # thresholds live in app/vitest.config.ts and are backstop floors: the job
      # goes red if coverage regresses below the recorded baseline.
      - name: Test (with coverage floor)
        run: pnpm test:run --coverage

      # Reads the json-summary reporter's output rather than scraping the test
      # log, so the numbers survive whatever else vitest prints. Runs even on a
      # red job because reportOnFailure is on: a run that broke for an unrelated
      # reason still reports where coverage stands.
      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            exit 0
          fi
          {
            echo '### Coverage'
            echo
            jq -r '
              "| Metric | Covered | Total | % |",
              "|---|---:|---:|---:|",
              (.total | to_entries[] | select(.key != "branchesTrue")
                | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct)% |")
            ' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      # The connectors package's OWN co-located suite (#225 PR-C2): the tests
      # that moved with the modules out of the app's tree run from their
      # workspace member. The app suite above covers everything that stayed
      # app-side; this covers what moved (and its own guards — the use-server
      # strip pin, the supplier-throw tests, the package-side read-only scan).
      - name: Package tests (@hames/connectors)
        working-directory: packages/connectors
        run: pnpm test

      # Same co-located-suite arrangement for @hames/harness-patterns (the
      # core-absorb PR-1): the observability projections + metrics fold moved
      # with their tests into the package's own `__tests__/` tree. Node
      # environment, no app fixtures — see the package's vitest.config.ts.
      - name: Package tests (@hames/harness-patterns)
        working-directory: packages/harness-patterns
        run: pnpm test

      # Same story for the sandbox package (the @hames/sandbox extraction): the
      # thirteen suites that moved with the code run from their workspace
      # member. They are hermetic — the docker CLI and the MCP SDK are mocked at
      # their lowest seam, as they were app-side — so this needs no daemon.
      # What stayed app-side: `egress-proxy.test.ts`, which drives
      # `rootfs/egress-proxy/proxy.mjs` (repo infrastructure, not package code).
      #
      # `--coverage` on the command line, not in the package's `test` script:
      # the app step above does it the same way, so a local `pnpm test` stays
      # fast while CI runs the floor. The thresholds live in
      # packages/sandbox/vitest.config.ts — without this flag they would be
      # inert, which is the shape the #365 review's O1 was about.
      - name: Package tests (@hames/sandbox, with coverage floor)
        working-directory: packages/sandbox
        run: pnpm test --coverage

      # Catches SSR/vinxi breakage the unit tests cannot see.
      - run: pnpm build

  packages:
    name: pack · tarball install · exports probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No `continue-on-error` (dropped 2026-09-20 by the BAML-companion seam
    # lane): the module-eval blocker the job used to tolerate is gone — the
    # last imports escaping into app/src/lib (the harness-baml defaults and
    # the CriticFnWithLLMData type) were removed from core, and the
    # zero-app-imports pin under app/src/__tests__ keeps them out. The job
    # now reports its true conclusion: a red fails the workflow run and is a
    # visible regression. What BLOCKS a merge is decided by the
    # CI-before-merge ruleset (the enforcement mechanism, not this file) —
    # `check` is on it today; whether the pack job joins the ruleset's
    # required_status_checks is a pending owner decision, not a scheduled
    # change — which is why this comment does not claim the job gates merges
    # like `check` does.

    # Runs the pack + install-from-tarball smoke (#225 Step 1d; plan
    # §3.3/§4.3) — the ONLY step anywhere in CI that exercises "does the
    # published tarball actually work": the image job boots from the workspace
    # symlink, so only this catches a file missing from the `files`/`exports`
    # allowlist or a dependency the package imports but does not declare.
    # Independent of `check` and `image` on purpose, like those two are of
    # each other.
    #
    # Deliberately NO `pnpm install` of the workspace: packing needs only the
    # manifest, and the probe runs against the tarball installed into a
    # throwaway scratch project — the repo's node_modules would only offer the
    # workspace symlink, which is exactly the resolution this smoke exists to
    # rule out.
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Fails the step if an export is missing from the tarball, a declared
      # export target does not exist, the package imports something its own
      # manifest does not declare, or the ./guard companion subpath does not
      # import and behave. The module-eval probe (barrel + every app-imported
      # subpath) was RED on main until the seam lanes removed the app/src
      # edges; it is GREEN now — a red here is a regression, not
      # a known blocker (which checks block merges is the CI-before-merge
      # ruleset's call, not this job's).
      - name: Run the pack smoke
        id: pack_smoke
        run: scripts/pack-smoke.sh

  image:
    name: docker image · build · boot
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Independent of `check` on purpose: it builds the same code a different
    # way (inside the image, from the lockfile, with the BAML client generated
    # there), so running them in parallel costs nothing and a red one localises
    # the breakage by itself.
    steps:
      - uses: actions/checkout@v4

      # `defaults.run.working-directory` is app/, which is still the main build
      # context — the repo-root files the build needs (the three workspace
      # manifests/lockfile plus, since #225 Step 1c, the
      # packages/harness-patterns source tree) arrive through the scoped
      # additional context `root=.` (--build-context needs BuildKit;
      # ubuntu-latest's docker ≥23 runs `docker build` on buildx). Only
      # COPY-named paths can cross it, and app/.dockerignore is untouched —
      # the allowlist IS the boundary, deliberately not a repo-root context.
      - name: Build the image
        working-directory: .
        run: docker build --build-context root=. -f app/Dockerfile --tag kg-agent-app:ci app

      # Booting proves less than it looks: /api/health touches neither native
      # package, so an image whose traced node_modules lost node-pty's .node
      # addon or BAML's entry file still passes the smoke test below and only
      # fails on the first Shell tab or the first BAML call. Require them here.
      # `-w /app/.output/server` is where the server bundle itself resolves from
      # (its node_modules sits beside index.mjs), not the /app the CMD runs in.
      # The listing is in the failure branch on purpose: `ls` exits 0 on an empty
      # directory, so it asserts nothing the require above did not — it is here
      # to say WHICH file is missing when the require goes red.
      - name: Assert the natives are self-contained
        run: |
          docker run --rm -w /app/.output/server --entrypoint node kg-agent-app:ci \
            -e "require('node-pty'); require('@boundaryml/baml'); console.log('native OK')" || {
            docker run --rm --entrypoint ls kg-agent-app:ci \
              -lR /app/.output/server/node_modules/node-pty /app/.output/server/node_modules/@boundaryml || true
            exit 1
          }

      # A container that builds but does not boot is not a passing gate. This
      # runs the image with NO dependencies attached: /api/health is a liveness
      # probe that touches none of them, and the routine scheduler's tick
      # catches its own DB errors, so "serves 200" is the honest bar here.
      # Postgres/Neo4j/gateway wiring is exercised by `docker compose up -d app`,
      # not by CI.
      #
      # Since #225 Step 1c the boot also exercises the WORKSPACE PACKAGE:
      # /api/stash imports @hames/harness-patterns at module scope (its barrel),
      # so a 200 there proves the server bundle's inlined package source loads
      # and runs — the runtime half of the workspace-link story the deps stage
      # canary proves at build time.
      - name: Boot it and hit /api/health
        run: |
          docker run -d --name app-smoke -p 3444:3444 kg-agent-app:ci
          served=""
          for i in $(seq 1 30); do
            if [ -z "$served" ] && curl -fsS localhost:3444/api/health; then
              echo && echo "healthy after ${i}s"
              served=1
            fi
            health_status=$(docker inspect -f '{{.State.Health.Status}}' app-smoke)
            echo "HEALTHCHECK status: ${health_status}"
            if [ -n "$served" ] && [ "$health_status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not serve /api/health and report HEALTHCHECK=healthy within 30s"
          docker logs app-smoke
          exit 1

      # The runtime half of the Step 1c proof: /api/stash loads the
      # @hames/harness-patterns barrel at module scope, so any response at all
      # means the inlined package source parsed and executed (a broken link or
      # a truncated copy would 500 on module load). Assert 200: verified
      # unauthenticated and dependency-free in the same kind of container.
      - name: Assert the workspace package loads at runtime
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3444/api/stash)
          echo "/api/stash -> ${code}"
          [ "$code" = "200" ] || { echo "::error::/api/stash returned ${code} — the workspace package did not load at runtime"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs app-smoke || true
# trailing comment
