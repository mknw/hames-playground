# Pin the compose project name. Without this it defaults to the directory name,
# so renaming the checkout would silently orphan the `kg-agent_*` named volumes
# (Postgres, Neo4j, Redis) and bring the stack up against empty new ones.
name: kg-agent

services:
  neo4j:
    image: neo4j:5.26
    container_name: neo4j-mldsgraph
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "n10s"]
    volumes:
      - neo4j_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-gateway:
    image: docker/mcp-gateway
    restart: unless-stopped
    command:
      - --enable-all-servers
      - --config=/mcp/config.yaml
      - --catalog=/mcp/custom-catalog.yaml
      - --transport=streaming
      - --port=8811
      - --verbose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/mcp-config.yaml:/mcp/config.yaml:ro
      - ./configs/custom-catalog.yaml:/mcp/custom-catalog.yaml:ro
      - ./configs/catalog.yaml:/mcp/catalog.yaml:ro
      - ./docker-config.json:/root/.docker/config.json:ro
    ports:
      - "8811:8811"
    networks:
      - app-network
    depends_on:
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres-seederis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kgagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # redis-stack bundles RedisJSON + RediSearch, required by the Data Stash
    # pipeline (json_set/json_get for documents, vector index/search for chunks).
    # Plain redis:7-alpine has no modules. RedisInsight (8001) is left unmapped.
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-seederis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  doc-convert:
    # Document → markdown extraction sidecar for the Data Stash pipeline: turns
    # binary uploads (docx/odt/pptx/pdf) into markdown so they can be chunked,
    # embedded and searched. Serves `POST /extract` (multipart `files` +
    # `config`) and `GET /health` on :8000. Used only when STASH_CONVERT_DOCS=1
    # (the app reads DOC_CONVERT_URL, default http://localhost:8000).
    #
    # Stable kreuzberg 4.x (Rust core, native parsers — no LibreOffice/pandoc).
    # Alternative: the xberg successor line, e.g.
    #   image: ghcr.io/xberg-io/xberg:1.0.0-rc.29-core
    # exposes the same /extract contract (currently release-candidate only).
    image: ghcr.io/kreuzberg-dev/kreuzberg-full:latest
    container_name: doc-convert-seederis
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - app-network

  app:
    # The SolidStart app (#197). Deployment/parity — NOT the dev loop: `pnpm dev`
    # on the host is still the way to develop, and this service is not part of
    # the `docker compose up -d` bring-up that supports it (start it explicitly:
    # `docker compose up -d app`, or bring the whole stack up with `--profile app`).
    profiles: ["app"]
    build:
      context: ./app
      dockerfile: Dockerfile
    image: kg-agent-app:local
    container_name: kg-agent-app
    restart: unless-stopped
    ports:
      - "3444:3444"
    env_file:
      # Secrets and per-tenant config (ANTHROPIC_API_KEY, AZURE_*, allow-list).
      # Optional so a fresh clone without an app/.env can still bring the rest
      # of the stack up — the app itself will not start usefully without it.
      - path: ./app/.env
        required: false
    environment:
      # `environment` wins over `env_file`, which is what makes these the
      # in-network rewrites of app/.env's host-facing defaults. Neo4j needs no
      # entry: config/endpoints.ts resolves bolt://neo4j:7687 in a production
      # build (the localhost form is the `import.meta.env.DEV` branch).
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/kgagent
      - MCP_GATEWAY_URL=http://mcp-gateway:8811/mcp
      - REDIS_HOST_DIRECT=redis
      - DOC_CONVERT_URL=http://doc-convert:8000
      # Data Stash embeddings run on a llama-server on the HOST (port 8090, see
      # CLAUDE.md), which is not a compose service — hence host.docker.internal.
      - EMBEDDINGS_LOCAL_URL=http://host.docker.internal:8090/v1
    extra_hosts:
      # Linux hosts need this mapping spelled out; Docker Desktop/colima provide
      # host.docker.internal anyway and ignore it.
      - "host.docker.internal:host-gateway"
    volumes:
      # The compute sandbox shells `docker run`/`docker exec` (sandbox
      # containers are siblings on the host, not children — none of those calls
      # bind-mount host paths, so they behave the same from in here). This mount
      # is root-equivalent on the host: drop it, and only the sandbox agents
      # stop working.
      - /var/run/docker.sock:/var/run/docker.sock
      # process.cwd() is /app at runtime, so server-catalog.server.ts and
      # action-tokens.server.ts's `../configs` candidate resolves to /configs —
      # without this mount the catalog/action-token lookups silently miss.
      - ./configs:/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-gateway:
        # No healthcheck on the gateway image, and the app reconnects per call
        # anyway (mcp-client.server.ts pools + retries), so started is enough.
        condition: service_started
      doc-convert:
        # No healthcheck on the doc-convert image; STASH_CONVERT_DOCS defaults
        # off so a slow/unready sidecar isn't on the critical path.
        condition: service_started
    networks:
      - app-network
    # The healthcheck lives in the image (app/Dockerfile) so `docker run` gets
    # it too; nothing to restate here.

networks:
  app-network:
    driver: bridge

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
