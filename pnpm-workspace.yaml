# One-member workspace (#225 Step 0, docs/plan/harness-npm-lib.md §5): the repo
# root becomes the pnpm workspace root and pnpm-lock.yaml lives here. No
# packages/ yet — nothing has been extracted.
packages:
  - app

# Moved from app/package.json `pnpm.onlyBuiltDependencies`: pnpm 10 reads the
# dependency build-script allowlist from the workspace manifest, not from a
# member's package.json. Without it node-pty compiles nothing and every pty
# path dies.
onlyBuiltDependencies:
  - node-pty
