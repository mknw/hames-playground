# Committed default gateway config. It holds NO credential: the two password
# placeholders below are filled from the repo-root `.env` by the one-shot
# `mcp-config` service in docker-compose.yaml (scripts/render-mcp-config.sh),
# which is also what the databases themselves are created from — one source,
# so the gateway cannot disagree with them. The gateway reads the rendered copy,
# never this file directly. A deployment may still write literals here instead
# (see .gitignore for that story); a file with no placeholder renders unchanged.
# A fresh
# clone needs this file to exist BEFORE `docker compose up -d`: compose
# bind-mounts it into the mcp-gateway, and a missing file becomes an empty
# directory inside the container, which the gateway refuses to start on.
# Field reference: configs/template.mcp-config.yaml.

neo4j-cypher:
  enabled: true
  uri: bolt://neo4j:7687
  username: neo4j
  password: ${NEO4J_PASSWORD}
  database: neo4j
  # Agents are read-only against Neo4j (#403): with `true` the server does not
  # offer write_neo4j_cypher. Keep it `true` — the app withholds that tool
  # from every agent anyway, so `false` only re-opens the server side.
  read_only: true

fetch:
  enabled: true

web_search:
  enabled: true

context7:
  enabled: true

rust-mcp-filesystem:
  enabled: true
  allow_write: true
  enable_roots: false
  allowed_directories:
    - /workspace

memory:
  enabled: true

redis:
  enabled: true
  host: redis
  port: "6379"
  username: ""
  password: ""
  ssl: false

database-server:
  enabled: true
  database_url: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/hames

playwright:
  enabled: true
