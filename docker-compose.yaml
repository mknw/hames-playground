# Pin the compose project name. Without this it defaults to the directory name,
# so renaming the checkout would silently orphan the `hames_*` named volumes
# (Postgres, Neo4j, Redis) and bring the stack up against empty new ones.
name: hames

# Laptop hardening, same standard as docker-compose.prod.yaml:
#
#   * Every `ports:` entry is bound to 127.0.0.1. A bare `5432:5432` publishes
#     on 0.0.0.0, i.e. to the LAN/café Wi-Fi, and on Linux Docker's iptables
#     rules bypass `ufw` for those publishes. Containers are unaffected: they
#     reach each other by service name over `app-network`, never through a
#     published port.
#   * The two database passwords are `${VAR:?}` substitutions read from the
#     repo-ROOT `.env` (Compose's substitution source — not `app/.env`). A
#     missing value fails the bring-up loudly. Template: `.env.example`.
#     They are applied only when a data volume is FIRST created — an existing
#     volume keeps the password it was born with. Upgrade path:
#     docs/DOCKER_COMPOSE.md "Credentials and existing volumes".

services:
  neo4j:
    image: neo4j:5.26
    container_name: hames-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in the repo-root .env — see .env.example}
      - NEO4J_PLUGINS=["apoc", "n10s"]
    volumes:
      - neo4j_data:/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-config:
    # One-shot: renders configs/mcp-config.yaml's ${NEO4J_PASSWORD} placeholder
    # from the same root-.env value Neo4j is created with, into the volume the
    # gateway reads. That makes the root .env the gateway's source too; before
    # this the gateway config carried literals that silently disagreed with any
    # other password. Re-runs on every `docker compose up`; after changing the
    # config, the catalog or a password, render and recreate:
    #   docker compose run --rm mcp-config &&
    #     docker compose up -d --no-deps --force-recreate mcp-gateway
    # (`--no-deps` alone skips this renderer and the gateway re-reads the old
    # copy; `&&` keeps a refused render from recreating it on the old one:
    # docs/MCP_GATEWAY.md "Neo4j writes"). postgres:16-alpine only
    # because the stack already pulls it and it has a POSIX sh + awk; it runs
    # no database here, and it is deliberately NOT given POSTGRES_PASSWORD: no
    # gateway server reaches Postgres (no-agent-postgres.test.ts).
    image: postgres:16-alpine
    entrypoint:
      ["/bin/sh", "/render.sh", "/in/mcp-config.yaml", "/out/config.yaml"]
    environment:
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in the repo-root .env — see .env.example}
    volumes:
      - ./scripts/render-mcp-config.sh:/render.sh:ro
      - ./configs/mcp-config.yaml:/in/mcp-config.yaml:ro
      - mcp_config:/out
    network_mode: none
    restart: "no"

  mcp-gateway:
    # Pinned by digest: upstream's current releases cannot run this stack
    # (#417, decision 9). Unpinned, a fresh host pulls `latest`, and since
    # v0.43.1 (#417 verified it by running v0.44.1) the gateway
    #   * refuses `--catalog=/mcp/custom-catalog.yaml` at start-up, because a
    #     local catalog must now resolve inside its own catalogs directory;
    #   * requires auth in container mode, so the app's unauthenticated
    #     `initialize` gets HTTP 401 (#392).
    # This digest is the 2026-01-22 build, from before both changes, that the
    # laptop stack runs on. It is a multi-arch index (linux/amd64 and
    # linux/arm64), and no upstream tag names it any more.
    #
    # Before bumping it:
    #   1. send a bearer token from the app (#392 step 1, the token from .env);
    #   2. move the catalog mount under /root/.docker/mcp/catalogs/, and the
    #      `--catalog` flag here AND in docker-compose.prod.yaml with it;
    #   3. check the `--config` path too, which #417 did not;
    #   4. verify on a freshly pulled image, never on a laptop's cached one.
    # compose-gateway-image.test.ts fails if this stops being a digest.
    image: docker/mcp-gateway@sha256:abb58d13e267939e602118c0be88be31e2ebcea4c762980ff647ee2aeba92cde
    restart: unless-stopped
    command:
      - --enable-all-servers
      # The RENDERED config (see `mcp-config` above), not the tracked file.
      - --config=/mcp/rendered/config.yaml
      - --catalog=/mcp/custom-catalog.yaml
      - --transport=streaming
      - --port=8811
      - --verbose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mcp_config:/mcp/rendered:ro
      - ./configs/custom-catalog.yaml:/mcp/custom-catalog.yaml:ro
      - ./configs/catalog.yaml:/mcp/catalog.yaml:ro
      # Turns the gateway's `dynamic-tools` feature OFF, so it does not add its
      # own management tools (mcp-find, mcp-add, mcp-remove, mcp-exec,
      # mcp-config-set, code-mode) to the tool list (#412, #420). The key must
      # stay, set to "disabled": the gateway's default when the key or the file
      # is missing is ON. The app also drops those names from its catalog
      # (`listTools` in harness-patterns' mcp-client.server.ts).
      - ./docker-config.json:/root/.docker/config.json:ro
    ports:
      - "127.0.0.1:8811:8811"
    networks:
      - app-network
    depends_on:
      neo4j:
        condition: service_healthy
      mcp-config:
        condition: service_completed_successfully

  postgres:
    # pgvector's postgres:16 image (Debian bookworm), pinned by its manifest
    # INDEX digest — the SAME digest `.github/workflows/ci.yml` runs its
    # `test · postgres` job on, so dev, compose and CI are one image
    # (postgres-image-pin.test.ts fails when they part). `withMemory` stores
    # embeddings in a `vector(1024)` column (#419) and the alpine image cannot
    # `CREATE EXTENSION vector`. musl -> glibc changes text collation, so an
    # EXISTING `postgres_data` volume must not be pointed at this image: move it
    # by dump-and-restore into a fresh volume, once, with
    # docs/deployment/pgvector-migration.md and scripts/migrate-postgres-pgvector.sh.
    # Bumping it: take the new INDEX digest, change it here and in ci.yml
    # together, and re-run the restore drill in that runbook.
    image: pgvector/pgvector:0.8.0-pg16-bookworm@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    container_name: hames-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env — see .env.example}
      - POSTGRES_DB=hames
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # redis-stack bundles RedisJSON + RediSearch, required by the Data Stash
    # pipeline (json_set/json_get for documents, vector index/search for chunks).
    # Plain redis:7-alpine has no modules. RedisInsight (8001) is left unmapped.
    image: redis/redis-stack:7.4.0-v8
    # arm64 hosts: the native arm64 build SIGILLs in RediSearch's SIMD paths
    # (exit-132 crash loop, hit by the 2026-09-14 install test); the amd64
    # build emulates those instructions. On x86 this is the native image, so
    # the line is a no-op there.
    platform: linux/amd64
    container_name: hames-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  doc-convert:
    # Document → markdown extraction sidecar for the Data Stash pipeline: turns
    # binary uploads (docx/odt/pptx/pdf) into markdown so they can be chunked,
    # embedded and searched. Serves `POST /extract` (multipart `files` +
    # `config`) and `GET /health` on :8000. Used only when STASH_CONVERT_DOCS=1
    # (the app reads DOC_CONVERT_URL, default http://localhost:8000).
    #
    # Stable kreuzberg 4.x (Rust core, native parsers — no LibreOffice/pandoc).
    # Alternative: the xberg successor line, e.g.
    #   image: ghcr.io/xberg-io/xberg:1.0.0-rc.29-core
    # exposes the same /extract contract (currently release-candidate only).
    image: ghcr.io/kreuzberg-dev/kreuzberg-full:latest
    container_name: hames-doc-convert
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app-network

  embedder:
    # The memory/Data Stash embedder (#419 M8): `llama-server --embedding` over
    # Qwen3-Embedding-0.6B, the same invocation as `make embed`, on the compose
    # network ONLY. It has no `ports:` — nothing on the host or the LAN can
    # reach it, and the app finds it by service name (`EMBEDDINGS_LOCAL_URL`
    # below). Memory text is profiling data about employees (SD-10, SD-12), so
    # the embedder is company-run and unreachable from outside by construction;
    # compose-embedder.test.ts pins both halves, in this file AND in
    # docker-compose.prod.yaml, which must close the exposure on its own (SD-18).
    # A deployment that really needs it on the host (the systemd run shape,
    # docs/deployment/azure-vm.md §7) adds a git-ignored override bound to
    # 127.0.0.1 — never here.
    #
    # In the `app` profile with the container app: the host dev loop keeps
    # using `make embed` on :8090 and never needs this. The GGUF is not in git
    # (models/README.md); the container exits at start if it is missing, which
    # is why it is not part of the bare `docker compose up -d`.
    #
    # Pinned by index digest (multi-arch: linux/amd64 and linux/arm64) under the
    # floating `server` tag, which is what a re-tag cannot change under us. It
    # may scale to zero behind the joint memory wake (lib/inference/
    # memory-wake.server.ts), whose probe is `POST {EMBEDDINGS_LOCAL_URL}/embeddings`
    # — a forward pass, never this healthcheck — so URL, path and port here are
    # what that module reads.
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:33868c035b21dc63f7c60b7438774283fd99215bc319114eb03de5df4ce7cd6b
    profiles: ["app"]
    restart: unless-stopped
    command:
      - --embedding
      - -m
      - /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --ctx-size
      - "8192"
    volumes:
      - ./models:/models:ro
    # Placeholder, not a measurement: the GGUF is 639 MB and the RSS of
    # llama-server on top of it is unmeasured (#419 spec §7).
    mem_limit: 2g
    networks:
      - app-network
    healthcheck:
      # /health answers 503 while the weights load and 200 once they are in.
      # Compose ordering only: readiness for the app is the memory wake's
      # forward-pass probe, and /health was never proof of that.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    # The SolidStart app (#197). Deployment/parity — NOT the dev loop: `pnpm dev`
    # on the host is still the way to develop, and this service is not part of
    # the `docker compose up -d` bring-up that supports it (start it explicitly:
    # `docker compose up -d app`, or bring the whole stack up with `--profile app`).
    profiles: ["app"]
    build:
      context: ./app
      dockerfile: Dockerfile
      # #225 Step 0 bridge, widened at Step 1c: the build context is still
      # app/, so the repo-root files the build needs (the three workspace
      # manifests/lockfile plus the packages/harness-patterns source tree) ride
      # in via this scoped named context — only COPY-named paths can cross it.
      # The allowlist IS the boundary (see app/Dockerfile's deps stage); the
      # Dockerfile's build-time canary proves the workspace link on every
      # build.
      additional_contexts:
        root: .
    image: hames-app:local
    container_name: hames-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3444:3444"
    env_file:
      # Secrets and per-tenant config (ANTHROPIC_API_KEY, AZURE_*, allow-list).
      # Optional so a fresh clone without an app/.env can still bring the rest
      # of the stack up — the app itself will not start usefully without it.
      - path: ./app/.env
        required: false
    environment:
      # `environment` wins over `env_file`, which is what makes these the
      # in-network rewrites of app/.env's host-facing defaults, with the
      # passwords folded in from the same root-.env variables the databases
      # read. The Neo4j URL needs no entry: config/endpoints.ts resolves
      # bolt://neo4j:7687 in a production build (the localhost form is the
      # `import.meta.env.DEV` branch) — only the credential is supplied here.
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env — see .env.example}@postgres:5432/hames
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in the repo-root .env — see .env.example}
      - MCP_GATEWAY_URL=http://mcp-gateway:8811/mcp
      - REDIS_HOST_DIRECT=redis
      - DOC_CONVERT_URL=http://doc-convert:8000
      # The `embedder` service above, by name, on the compose network. The `/v1`
      # suffix is required: `/embeddings` is appended verbatim by both the
      # Data Stash client and the memory wake's probe.
      - EMBEDDINGS_LOCAL_URL=http://embedder:8090/v1
    extra_hosts:
      # Linux hosts need this mapping spelled out; Docker Desktop/colima provide
      # host.docker.internal anyway and ignore it. Kept for the one thing that
      # still lives on the host: `SMALL_LLM_BASE_URL` (`make llm-small`, :8095).
      - "host.docker.internal:host-gateway"
    volumes:
      # The compute sandbox shells `docker run`/`docker exec` (sandbox
      # containers are siblings on the host, not children — none of those calls
      # bind-mount host paths, so they behave the same from in here). This mount
      # is root-equivalent on the host: drop it, and only the sandbox agents
      # stop working.
      - /var/run/docker.sock:/var/run/docker.sock
      # process.cwd() is /app at runtime, so server-catalog.server.ts and
      # action-tokens.server.ts's `../configs` candidate resolves to /configs —
      # without this mount the catalog/action-token lookups silently miss.
      - ./configs:/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-gateway:
        # No healthcheck on the gateway image, and the app reconnects per call
        # anyway (mcp-client.server.ts pools + retries), so started is enough.
        condition: service_started
      embedder:
        # Started, not healthy: the embedder may scale to zero and memory is
        # fail-open behind the joint wake, so a slow weight load must not hold
        # the app back.
        condition: service_started
      doc-convert:
        # No healthcheck on the doc-convert image; STASH_CONVERT_DOCS defaults
        # off so a slow/unready sidecar isn't on the critical path.
        condition: service_started
    networks:
      - app-network
    # The healthcheck lives in the image (app/Dockerfile) so `docker run` gets
    # it too; nothing to restate here.

networks:
  app-network:
    driver: bridge

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
  # The gateway's rendered config (derived, rewritten on every `up`).
  mcp_config:
