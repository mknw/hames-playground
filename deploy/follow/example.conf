# /etc/hames-deploy-follow/<env>.conf — one per environment, root-owned 0644.
# No secrets: every value here is a path, a name or a public repository slug.
# The deploy user needs write access to the checkout, the state directory and
# the runtime env file, and Docker access (the docker group).

# dev | release. Decides the env and infra policy (docs/deployment/branch-deploys.md).
FOLLOW_ENV=dev
# main for dev, release for release.
FOLLOW_BRANCH=main
FOLLOW_REPO=<owner>/<repository>
# The checkout this environment's image is built from.
FOLLOW_CHECKOUT=/srv/app-dev
# The Compose project directory (the release checkout, for both environments).
FOLLOW_COMPOSE_DIR=/srv/app
# app-dev for dev, app for release; and the image tag that service runs.
FOLLOW_SERVICE=app-dev
FOLLOW_IMAGE=hames-app:dev
# The environment's app-only runtime env file (DEV_RUNTIME_ENV_FILE / RELEASE_RUNTIME_ENV_FILE).
FOLLOW_RUNTIME_ENV=/srv/env/dev.env
# dev only: the root .env key pinning the dev checkout (DEV_REF). Empty for release.
FOLLOW_REF_KEY=DEV_REF
# release only: skip-worktree files the host manages inside the checkout.
FOLLOW_MANAGED_FILES=
# release only: the release-check GO recorded by deploy/follow/promote.py.
FOLLOW_REQUIRED_STATUSES=
FOLLOW_STATE_DIR=/var/lib/hames-deploy-follow/dev
# Shared by both environments: one deploy at a time on the host.
FOLLOW_LOCK=/var/lib/hames-deploy-follow/host.lock
