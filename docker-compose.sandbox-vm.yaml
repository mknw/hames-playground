# Opt in AFTER docker-compose.yaml (and deployment overlays), Compose >=2.24.4.
# Mount ONLY the three Docker client files, never the operator state directory.
# The MCP gateway's own Docker socket is unchanged and remains out of scope.
services:
  app:
    environment:
      SANDBOX_DOCKER_HOST: ${SANDBOX_DOCKER_HOST:?set the environment VM TCP endpoint}
      SANDBOX_DOCKER_TLS_CA: /run/sandbox-tls/ca.pem
      SANDBOX_DOCKER_TLS_CERT: /run/sandbox-tls/cert.pem
      SANDBOX_DOCKER_TLS_KEY: /run/sandbox-tls/key.pem
    volumes: !override
      - ./configs:/configs:ro
      - ${SANDBOX_DOCKER_TLS_CA:?set the Docker CA file}:/run/sandbox-tls/ca.pem:ro
      - ${SANDBOX_DOCKER_TLS_CERT:?set the Docker client certificate}:/run/sandbox-tls/cert.pem:ro
      - ${SANDBOX_DOCKER_TLS_KEY:?set the Docker client key}:/run/sandbox-tls/key.pem:ro
