# The env-key contract a deployed commit holds its app runtime env file to.
# deploy-follow.py reads THIS file from the commit it is about to deploy, and
# compares it with the KEY NAMES of the environment's runtime env file (never a
# value). docs/deployment/branch-deploys.md has the rules; in short:
#
#   retired KEY          boot refuses the commit while KEY is set
#                        DEV unsets it; RELEASE stops and asks
#   required KEY         boot cannot run without KEY, and nothing can invent it
#                        BOTH environments stop and ask while it is missing
#   default KEY VALUE    KEY must be present, VALUE is its documented safe default
#                        DEV adds it; RELEASE stops and asks. Never a secret.
#
# Keep it in step with the boot validators: when a commit retires a key or
# makes one mandatory, the same commit edits this file.
# app/src/__tests__/deploy/env-keys-manifest.test.ts pins every line below
# against the code that enforces it.

# guard-config.server.ts: a set value refuses boot.
retired GUARD_EGRESS
retired GUARD_GATE_THRESHOLD

# The keys every app runtime env file carries (docs/PREVIEW.md §12): the
# per-clone application keys and the Entra sign-in values.
required AUTH_SESSION_SECRET
required TOKEN_ENCRYPTION_KEY
required DATA_ENCRYPTION_KEY
required AZURE_TENANT_ID
required AZURE_CLIENT_ID
required AZURE_CLIENT_SECRET
required VITE_ALLOWED_EMAILS
